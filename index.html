<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#AF0206">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="南華法規">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>南華大學校內法規查詢</title>
<style>
:root{
  --paper:#F7F6F2; --ink:#16211D; --ink-soft:#4A544E;
  --pine:#23503F; --pine-light:#EAF0EC;
  --vermilion:#9B3A2E; --brass:#A98545;
  --rule:#DFDCD2; --rule-soft:#EDEBE4; --white:#FFFEFB;
  --shadow:0 1px 2px rgba(22,33,29,.06), 0 8px 24px rgba(22,33,29,.07);
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",Georgia,serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --mono:ui-monospace,"SFMono-Regular","Menlo",monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--pine); outline-offset:2px; border-radius:2px}

/* ── 頁首：一條細窄的典章橫幅，不做大英雄區 ── */
header{
  border-bottom:1px solid var(--rule); background:var(--white);
  padding:18px 28px; display:flex; align-items:baseline; gap:18px; flex-wrap:wrap;
}
header h1{
  font-family:var(--serif); font-size:21px; font-weight:600; margin:0;
  letter-spacing:.06em;
}
header h1 .mark{color:var(--pine)}
header .meta{
  font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);
  letter-spacing:.04em; margin-left:auto;
}

/* ── 版面 ── */
.wrap{display:grid; grid-template-columns:236px 1fr; gap:0; align-items:start}
aside{
  border-right:1px solid var(--rule); padding:24px 20px 60px;
  position:sticky; top:0; max-height:100vh; overflow-y:auto;
}
main{padding:24px 28px 80px; min-width:0}

.sec-title{
  font-family:var(--serif); font-size:14px; font-weight:600; color:var(--pine);
  letter-spacing:.14em; margin:0 0 10px; padding-bottom:7px;
  border-bottom:2px solid var(--pine);
}
aside .sec-title+ul{margin-top:0}
.facets{list-style:none; margin:0 0 26px; padding:0}
.facets li{margin:0}
.facets button{
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  font:inherit; color:var(--ink); padding:7px 6px 7px 16px; position:relative;
  border-radius:3px;
}
.facets button::before{
  content:"›"; position:absolute; left:3px; color:var(--brass); font-weight:700;
}
.facets button:hover{background:var(--pine-light); color:var(--pine)}
.facets button .n{
  font-family:var(--mono); font-size:11px; color:var(--white);
  background:var(--pine); border-radius:9px; padding:1px 6px; margin-left:6px;
}
.search-row{display:flex; gap:6px}
.search-row input{
  flex:1; min-width:0; font:inherit; padding:7px 9px; background:var(--white);
  border:1px solid var(--rule); border-radius:3px; color:var(--ink);
}
.search-row input:focus{border-color:var(--pine)}
.search-row button{
  font:inherit; padding:7px 12px; cursor:pointer; border-radius:3px;
  background:var(--pine); color:var(--white); border:1px solid var(--pine);
}
.search-row button:hover{background:#1B4033}
.hint{font-size:12px; color:var(--ink-soft); margin:8px 0 0; line-height:1.5}

/* ── 已選條件 ── */
.active-bar{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:14px; min-height:26px}
.chip{
  display:inline-flex; align-items:center; gap:6px; font-size:12.5px;
  background:var(--white); border:1px solid var(--rule); border-radius:14px;
  padding:3px 6px 3px 11px;
}
.chip .k{color:var(--ink-soft)}
.chip button{
  border:0; background:none; cursor:pointer; color:var(--ink-soft);
  font-size:14px; line-height:1; padding:2px 4px; border-radius:50%;
}
.chip button:hover{background:var(--vermilion); color:var(--white)}
.clear-all{
  font:inherit; font-size:12.5px; background:none; border:0; cursor:pointer;
  color:var(--vermilion); text-decoration:underline; padding:2px 4px;
}

.result-head{
  display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
  margin:0 0 12px; padding-bottom:9px; border-bottom:1px solid var(--rule);
}
.result-head h2{font-family:var(--serif); font-size:16px; font-weight:600; margin:0; letter-spacing:.08em}
.result-head .count{font-family:var(--mono); font-size:12.5px; color:var(--ink-soft)}
.result-head .tools{margin-left:auto; display:flex; gap:8px}
.result-head .tools button{
  font:inherit; font-size:12.5px; padding:4px 10px; cursor:pointer;
  background:var(--white); border:1px solid var(--rule); border-radius:3px; color:var(--ink-soft);
}
.result-head .tools button:hover{border-color:var(--pine); color:var(--pine)}

/* ── 表格 ── */
table{width:100%; border-collapse:collapse; background:var(--white); font-size:14px}
thead th{
  background:var(--pine); color:var(--white); font-weight:500; text-align:left;
  padding:9px 10px; font-size:13px; letter-spacing:.05em; white-space:nowrap;
  border-right:1px solid rgba(255,255,255,.14);
}
thead th:last-child{border-right:0}
thead th.sortable{cursor:pointer; user-select:none}
thead th.sortable:hover{background:#1B4033}
thead th .arrow{font-size:10px; opacity:.55; margin-left:3px}
thead th[aria-sort="ascending"] .arrow,
thead th[aria-sort="descending"] .arrow{opacity:1}
tbody td{padding:9px 10px; border-bottom:1px solid var(--rule-soft); vertical-align:top}
tbody tr.row{cursor:pointer}
tbody tr.row:hover td{background:var(--pine-light)}
tbody tr.row.open td{background:var(--pine-light)}
td.seq,td.num{font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); text-align:right; white-space:nowrap}
td.name{font-weight:500}
td.name .code{
  font-family:var(--mono); font-size:11px; color:var(--ink-soft);
  margin-left:8px; letter-spacing:.02em; white-space:nowrap;
}
td.name .status-tag{
  font-size:11px; letter-spacing:.05em; color:var(--white); background:var(--vermilion);
  border-radius:2px; padding:1px 6px; margin-right:7px; vertical-align:1px;
}
td.name .kindtag{
  font-family:var(--mono); font-size:10px; letter-spacing:.06em; color:var(--brass);
  border:1px solid var(--brass); border-radius:2px; padding:0 4px; margin-right:6px;
  vertical-align:1px;
}
td.date{font-family:var(--mono); font-size:12.5px; white-space:nowrap}
.badge-type{
  display:inline-block; font-size:12px; padding:1px 8px; border-radius:2px;
  background:var(--pine-light); color:var(--pine); white-space:nowrap;
}
.warn{color:var(--vermilion); font-size:11.5px; font-family:var(--mono)}
mark{background:#F6E7B0; color:inherit; padding:0 1px; border-radius:2px}
.snippet{
  font-size:12.5px; color:var(--ink-soft); margin-top:5px; line-height:1.55;
  border-left:2px solid var(--brass); padding-left:8px;
}

/* ── 條文抽屜（本頁的主角）── */
tr.detail td{background:var(--paper); padding:0; border-bottom:1px solid var(--rule)}
.drawer{padding:18px 22px 24px}
.drawer .revs{
  font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);
  border-left:3px solid var(--brass); padding:5px 0 5px 11px; margin:0 0 16px;
}
.drawer .revs div+div{margin-top:3px}
.arts{margin:0; counter-reset:none}
.art{display:grid; grid-template-columns:88px 1fr; gap:14px; padding:7px 0; border-bottom:1px dotted var(--rule)}
.art:last-child{border-bottom:0}
.art .label{
  font-family:var(--serif); font-size:13.5px; color:var(--pine); font-weight:600;
  white-space:nowrap; padding-top:1px;
}
.art .body{font-size:14px; line-height:1.75}
.art .body .txt{white-space:pre-wrap; display:block}
.tbl-wrap{overflow-x:auto; margin:9px 0; -webkit-overflow-scrolling:touch}
table.art-tbl{
  width:100%; min-width:420px; border-collapse:collapse; font-size:13px;
  background:var(--white); line-height:1.6;
}
table.art-tbl th{
  background:var(--pine-light); color:var(--pine); font-weight:600; text-align:left;
  padding:6px 9px; border:1px solid var(--rule); white-space:normal;
  font-size:12.5px; letter-spacing:normal;
}
table.art-tbl td{
  padding:6px 9px; border:1px solid var(--rule); vertical-align:top;
  white-space:normal; word-break:break-word;
}
table.art-tbl tr:nth-child(even) td{background:#FBFAF6}
.drawer .links{
  margin-top:14px; padding:9px 12px; background:var(--pine-light); border-radius:3px;
  font-size:12.5px; line-height:1.7;
}
.drawer .links .k{
  display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em;
  color:var(--pine); border:1px solid var(--pine); border-radius:2px; padding:0 5px;
  margin-bottom:5px;
}
.drawer .links .lk + .lk{margin-top:10px; padding-top:9px; border-top:1px dotted var(--rule)}
.drawer .links ul{margin:0; padding-left:17px; list-style:none}
.drawer .links li{position:relative; padding:1px 0; line-height:1.65}
.drawer .links li::before{
  content:"›"; position:absolute; left:-13px; color:var(--brass); font-weight:700;
}
.drawer .links .u{
  font-family:var(--mono); font-size:11px; color:var(--ink-soft); margin-left:7px;
}
.drawer .foot{
  margin-top:14px; padding-top:10px; border-top:1px solid var(--rule);
  font-family:var(--mono); font-size:11.5px; color:var(--ink-soft);
  display:flex; gap:16px; flex-wrap:wrap;
}
.page-foot{
  margin-top:34px; padding-top:16px; border-top:1px solid var(--rule);
  font-size:12.5px; color:var(--ink-soft); line-height:1.7;
}
.page-foot p{margin:0 0 6px}
.page-foot strong{color:var(--vermilion); font-weight:600}
.page-foot em{font-style:normal; text-decoration:underline; text-underline-offset:2px}
.page-foot a{color:var(--pine)}
.chip.asof{background:var(--pine); color:var(--white); border-color:var(--pine)}
.chip.asof .k{color:#CFE0D6}
.chip.asof button{color:var(--white)}
.asof-warn{
  background:#FBF1EE; border-left:3px solid var(--vermilion); color:var(--ink);
  padding:10px 13px; border-radius:3px; margin:0 0 14px; font-size:13px; line-height:1.75;
}
.asof-warn strong{color:var(--vermilion)}
.asof-ok{
  background:var(--pine-light); border-left:3px solid var(--pine); color:var(--pine);
  padding:8px 13px; border-radius:3px; margin:0 0 14px; font-size:12.5px;
}
td.name .gap-tag, td.date .gap-tag{
  display:inline-block; font-size:10.5px; color:var(--vermilion);
  border:1px solid var(--vermilion); border-radius:2px; padding:0 4px; margin-left:6px;
}
.empty{padding:44px 10px; text-align:center; color:var(--ink-soft)}
.empty strong{display:block; font-family:var(--serif); font-size:16px; color:var(--ink); margin-bottom:6px}

/* ── 分頁 ── */
.pager{display:flex; gap:5px; justify-content:center; align-items:center; margin-top:20px; flex-wrap:wrap}
.pager button{
  font:inherit; font-family:var(--mono); font-size:12.5px; min-width:30px; padding:5px 8px;
  cursor:pointer; background:var(--white); border:1px solid var(--rule); border-radius:3px; color:var(--ink);
}
.pager button:hover:not(:disabled){border-color:var(--pine); color:var(--pine)}
.pager button[aria-current="page"]{background:var(--pine); border-color:var(--pine); color:var(--white)}
.pager button:disabled{opacity:.35; cursor:default}

/* ── 對話框 ── */
dialog{
  border:0; border-radius:4px; padding:0; box-shadow:var(--shadow);
  max-width:min(760px,94vw); background:var(--white); color:var(--ink);
}
dialog::backdrop{background:rgba(22,33,29,.42)}
dialog .dlg-head{
  background:var(--pine); color:var(--white); padding:11px 16px;
  display:flex; align-items:center; gap:12px;
  font-family:var(--serif); font-size:15px; letter-spacing:.08em;
}
dialog .dlg-head button{
  margin-left:auto; background:none; border:0; color:var(--white);
  font-size:19px; line-height:1; cursor:pointer; padding:2px 6px; border-radius:3px;
}
dialog .dlg-head button:hover{background:rgba(255,255,255,.16)}
dialog .dlg-body{padding:18px 16px; max-height:56vh; overflow-y:auto}
.opts{display:grid; grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:9px}
.opts button{
  font:inherit; font-size:13.5px; padding:9px 8px; cursor:pointer; text-align:center;
  background:var(--white); border:1px solid var(--ink); border-radius:2px; color:var(--ink);
}
.opts button:hover{border-color:var(--pine); color:var(--pine)}
.opts button[aria-pressed="true"]{background:var(--pine); border-color:var(--pine); color:var(--white)}
.opts button .c{font-family:var(--mono); font-size:11px; opacity:.7; margin-left:4px}
.opt-group + .opt-group{margin-top:18px}
.opt-group-title{
  font-family:var(--serif); font-size:13.5px; letter-spacing:.14em; text-align:center;
  color:var(--pine); background:var(--pine-light); border:1px solid var(--rule);
  border-bottom:0; padding:6px 8px;
}
.opt-group .opts{
  grid-template-columns:repeat(3,1fr);
  border:1px solid var(--rule); border-top:0; padding:10px; gap:8px;
}
@media (max-width:560px){ .opt-group .opts{grid-template-columns:repeat(2,1fr)} }
.date-grid{display:grid; gap:12px; max-width:300px}
.date-grid label{font-size:13px; color:var(--ink-soft); display:grid; gap:4px}
.date-grid input{font:inherit; font-family:var(--mono); padding:6px 8px; border:1px solid var(--rule); border-radius:3px}
.quick{display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px dashed var(--rule)}
.quick button{font:inherit; font-size:13px; padding:6px 12px; cursor:pointer; background:var(--white); border:1px solid var(--ink); border-radius:2px}
.quick button:hover{border-color:var(--pine); color:var(--pine)}
dialog .dlg-foot{
  padding:11px 16px; border-top:1px solid var(--rule); display:flex; gap:9px; justify-content:flex-end;
  background:#FBFAF6;
}
dialog .dlg-foot button{font:inherit; font-size:13.5px; padding:6px 18px; cursor:pointer; border-radius:3px}
.btn-ok{background:var(--pine); border:1px solid var(--pine); color:var(--white)}
.btn-ok:hover{background:#1B4033}
.btn-cancel{background:var(--white); border:1px solid var(--rule); color:var(--ink-soft)}
.btn-cancel:hover{border-color:var(--ink-soft)}

@media (max-width:860px){
  .wrap{grid-template-columns:1fr}
  aside{position:static; max-height:none; border-right:0; border-bottom:1px solid var(--rule)}
  main{padding:18px 14px 60px}
  table{font-size:13px}
  .hide-sm{display:none}
  .art{grid-template-columns:1fr; gap:2px}
}

/* ── 手機：表格排不下，改成一列一張卡 ── */
@media (max-width:700px){
  header{padding:12px 16px; position:sticky; top:0; z-index:20}
  header h1{font-size:17px}
  header .meta{width:100%; margin-left:0; font-size:11px}

  aside{padding:14px 16px 18px}
  .facets{display:grid; grid-template-columns:repeat(2,1fr); gap:4px; margin-bottom:18px}
  .facets button{
    border:1px solid var(--rule); background:var(--white); text-align:center;
    padding:10px 6px 10px 14px; min-height:44px;
  }
  .search-row input{min-height:44px; font-size:16px}   /* 16px 以下 iOS 會自動放大 */
  .search-row button{min-height:44px}

  .results thead{display:none}
  .results, .results tbody, .results tr, .results td{display:block; width:100%}
  .results tbody tr.row{
    border:1px solid var(--rule); border-radius:4px; margin-bottom:9px;
    padding:11px 13px; background:var(--white); position:relative;
  }
  .results tbody tr.row.open{border-color:var(--pine)}
  .results tbody td{border:0; padding:0}
  .results tbody td.seq{
    position:absolute; top:11px; right:12px; font-size:11px; opacity:.5;
  }
  .results tbody td.name{font-size:15px; line-height:1.5; padding-right:34px; margin-bottom:8px}
  .results tbody td:not(.name):not(.seq){
    display:inline-block; width:auto; font-size:12px; color:var(--ink-soft);
    margin-right:12px; line-height:1.9;
  }
  .results tbody td:not(.name):not(.seq):empty{display:none}
  .results tbody td[data-l]::before{
    content:attr(data-l)"　"; font-family:var(--mono); font-size:10px;
    letter-spacing:.05em; opacity:.6;
  }
  .results tr.detail td{padding:0; border:0; background:transparent}
  .drawer{padding:12px 13px 18px; border:1px solid var(--pine); border-top:0;
          border-radius:0 0 4px 4px; margin:-9px 0 9px; background:var(--paper)}
  .empty{padding:30px 8px}
  .result-head h2{font-size:15px}
  .result-head .tools button{min-height:38px}
  .pager button{min-width:40px; min-height:40px}
  dialog{max-width:96vw}
  dialog .dlg-body{max-height:64vh}
  .opts button{min-height:46px}
  /* 條文裡的附件表格維持表格樣態，寬度不足時橫向捲動 */
  .art-tbl, .art-tbl thead, .art-tbl tbody, .art-tbl tr, .art-tbl td, .art-tbl th{display:revert}
  .art-tbl{min-width:520px}
  .tbl-wrap{margin:10px -2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
</style>
</head>
<body>

<header>
  <h1>南華大學<span class="mark">校內法規</span>查詢</h1>
  <span class="meta" id="stamp"></span>
</header>

<div class="wrap">
  <aside>
    <h2 class="sec-title">分類查詢</h2>
    <ul class="facets">
      <li><button data-facet="all">全部</button></li>
      <li><button data-facet="meeting">通過會議<span class="n" hidden></span></button></li>
      <li><button data-facet="unit">業管單位<span class="n" hidden></span></button></li>
      <li><button data-facet="type">法規類別<span class="n" hidden></span></button></li>
      <li><button data-facet="status">法規狀態<span class="n" hidden></span></button></li>
      <li><button data-facet="scope">校內／校外<span class="n" hidden></span></button></li>
      <li><button data-facet="kind">法規／SOP<span class="n" hidden></span></button></li>
      <li><button data-facet="uploaded">上傳日期<span class="n" hidden></span></button></li>
      <li><button data-facet="approved">通過日期<span class="n" hidden></span></button></li>
      <li><button data-facet="asof">適用日期查詢<span class="n" hidden></span></button></li>
    </ul>

    <h2 class="sec-title">關鍵字查詢</h2>
    <div class="search-row">
      <input id="q" type="search" placeholder="條文或名稱" aria-label="關鍵字">
      <button id="qbtn">搜尋</button>
    </div>
    <p class="hint">關鍵字會同時搜尋法規名稱與條文全文，命中的條文會顯示在結果列下方。</p>
  </aside>

  <main>
    <div class="active-bar" id="activeBar"></div>

    <div class="result-head">
      <h2>最新法規訊息</h2>
      <span class="count" id="count"></span>
      <div class="tools">
        <button id="expandAll">全部展開</button>
        <button id="exportCsv">匯出 CSV</button>
      </div>
    </div>

    <table class="results">
      <thead>
        <tr>
          <th style="width:44px">序</th>
          <th class="sortable" data-sort="name">法規名稱<span class="arrow">▲</span></th>
          <th class="sortable hide-sm" data-sort="meeting" style="width:104px">通過會議<span class="arrow">▲</span></th>
          <th class="sortable" data-sort="unit" style="width:116px">業管單位<span class="arrow">▲</span></th>
          <th class="sortable hide-sm" data-sort="type" style="width:96px">法規類別<span class="arrow">▲</span></th>
          <th class="sortable" data-sort="approved" style="width:104px">通過日期<span class="arrow">▲</span></th>
          <th class="sortable hide-sm" data-sort="uploaded" style="width:104px">上傳日期<span class="arrow">▲</span></th>
          <th class="sortable" data-sort="arts" style="width:66px">條文數<span class="arrow">▲</span></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <div class="pager" id="pager"></div>

    <footer class="page-foot">
      <p><strong>本頁為校務發展組維護之查詢輔助工具，非學校官方法規公告網頁。</strong>
      條文係自各單位提供之電子檔自動解析，如與各單位公告之原始檔案不符，
      <em>一律以原始檔案及會議通過之條文為準</em>。</p>
      <p id="footMeta"></p>
      <p>發現條文錯漏或版本過期，請來信
        <a href="mailto:chengchou@nhu.edu.tw?subject=法規查詢頁回報">校務發展組</a>。</p>
    </footer>
  </main>
</div>

<dialog id="dlg">
  <form method="dialog">
    <div class="dlg-head"><span id="dlgTitle"></span><button type="button" id="dlgX" aria-label="關閉">✕</button></div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-foot">
      <button type="button" class="btn-ok" id="dlgOk">確定</button>
      <button type="button" class="btn-cancel" id="dlgCancel">取消</button>
    </div>
  </form>
</dialog>

<script>
const UI_VERSION = 'v1.16';   // 改版時同步更新 變更紀錄.md
const DATA = {"generated": "2026-08-22 23:18", "regs": []};
const REGS = (DATA && DATA.regs) || [];
document.getElementById('footMeta').textContent =
  `資料來源：法規委員會彙整之各單位法規電子檔　最後建置：${(DATA && DATA.generated) || '—'}`
  + `　介面版本：${UI_VERSION}`;
document.getElementById('stamp').textContent =
  `${REGS.length} 部　${new Set(REGS.map(r=>r.unit)).size} 個單位　建置於 ${(DATA && DATA.generated) || '—'}`;

const FACETS = {
  meeting:  {label:'通過會議', key:'meeting'},
  unit:     {label:'業管單位', key:'unitLabel'},
  type:     {label:'法規類別', key:'type'},
  kind:     {label:'法規／SOP', key:'kind'},
  status:   {label:'法規狀態', key:'statusLabel'},
  scope:    {label:'校內／校外', key:'scope'},
};
// 顯示名稱對照：壓縮檔沿用的是承辦慣用簡稱，這裡換成秘書室組織架構上的正式名稱。
// 只改顯示，資料庫裡仍是原始名稱，對錯了隨時可以改回來。
const UNIT_DISPLAY = {
  '研發處': '校務及研究發展處',
  '產業合作及職涯發展處': '產學合作及職涯發展處',
  '祕書室': '秘書室',
  '人間佛教研究中心': '人間佛教研究及推廣中心',
};
REGS.forEach(r => { r.unitLabel = UNIT_DISPLAY[r.unit] || r.unit; });

// 業管單位依學校組織架構分三群顯示。用「明列 + 關鍵字備援」兩段式：
// 明列的照組織架構走，沒列到的（新單位、改名）再用關鍵字歸位，
// 都對不上就落到「其他」，不會憑空消失。
const UNIT_GROUPS = [
  {title:'行政單位', names:['教務處','學生事務處','學務處','總務處','國際及兩岸交流處','圖書館',
      '圖書資訊處','人事室','會計室','秘書室','校務及研究發展處','就學服務處',
      '產學合作及職涯發展處','終身學習學院','體育運動發展處']},
  {title:'學術單位', names:['管理學院','人文學院','社會科學院','科技學院','藝術與設計學院','通識教育中心']},
  {title:'校級中心', names:['人間佛教研究及推廣中心','生命教育中心','永續中心']},
];
// 群內順序：照組織架構表由上而下、由左而右，名單裡沒有的排在該群最後
function unitRank(name){
  for (const g of UNIT_GROUPS){
    const i = g.names.indexOf(name);
    if (i >= 0) return i;
  }
  return 999;
}
function unitGroup(name){
  for (const g of UNIT_GROUPS) if (g.names.includes(name)) return g.title;
  if (name.includes('學院')) return '學術單位';
  if (name.includes('中心')) return '校級中心';
  if (/[處室組館]$/.test(name)) return '行政單位';
  return '其他';
}

// 法規類別依位階排序，不按數量。位階本身是資訊：章程規程在最上位，
// 兩條規定衝突時由它決定誰優先，排在最前面才對得上使用者的心智模型。
const TYPE_ORDER = ['章程/規程', '辦法', '規則/細則', '作業要點', '其它'];
const typeRank = v => { const i = TYPE_ORDER.indexOf(v); return i < 0 ? 99 : i; };

const STATUS_LABEL = {current:'現行', repealed:'已廢止', draft:'討論版／草案'};
REGS.forEach(r => { r.statusLabel = STATUS_LABEL[r.status] || '現行'; });
const DATE_FACETS = {uploaded:'上傳日期', approved:'通過日期'};

// ── 適用日期查詢（時光查詢）────────────────────────────────
// 政府補助計畫要引用「該年度適用」的條文，例如 113 年度獎補助款要看的是
// 113/1/1–113/12/31 期間有效的版本，不是今天的版本。
// 這裡以沿革日期推算「當日適用的是哪一版」，再看版本庫有沒有那一版全文。
function resolveAsOf(r, asOf){
  const dates = [...new Set([...(r.tl||[]).map(x => x.d), r.approved].filter(Boolean))].sort();
  if (!dates.length) return {unknown:true};
  const inForce = [...dates].reverse().find(d => d <= asOf);
  if (!inForce) return {notYet:true, first:dates[0]};
  const held = (r.vers||[]).find(v => v.from && v.from <= asOf && (!v.to || v.to >= asOf));
  const line = (r.tl||[]).find(x => x.d === inForce);
  return {date:inForce, held:held || null, line:line ? line.line : null};
}

const state = {
  // 預設只看現行法規。已廢止與草案仍在庫裡，但要使用者主動勾選才會出現——
  // 查法規的人拿到一部已廢止的條文卻不知道，比查不到嚴重得多。
  sel: {meeting:new Set(), unit:new Set(), type:new Set(), kind:new Set(),
        status:new Set(['現行']), scope:new Set()},
  // 預設不顯示查不到通過會議的項目（依使用者設定）。這不等於「沒開過會」，
  // 只代表檔名與內文都沒留下會議紀錄，所以做成可取消的條件而非硬性排除。
  requireMeeting: true,
  range: {uploaded:null, approved:null},   // {from,to}
  q: '', sort:'approved', dir:-1, page:1, per:20, open:new Set(), asOf:'',
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val = (r,k) => k==='arts' ? r.arts.length : (r[k] ?? '');

function values(key){
  const m = new Map();
  for (const r of REGS){
    const v = r[key] || '（未標示）';
    m.set(v, (m.get(v)||0)+1);
  }
  const out = [...m.entries()];
  if (key === 'type') return out.sort((a,b) => typeRank(a[0]) - typeRank(b[0]));
  return out.sort((a,b) => b[1]-a[1] || a[0].localeCompare(b[0],'zh-Hant'));
}

function matchQ(r, q){
  if (!q) return {ok:true, hits:[]};
  const needle = q.toLowerCase();
  const hits = [];
  for (const a of r.arts){
    if (a.t.toLowerCase().includes(needle)) hits.push(a);
    if (hits.length >= 3) break;
  }
  const inName = (r.name||'').toLowerCase().includes(needle);
  return {ok: inName || hits.length > 0, hits};
}

function inRange(dateStr, rg){
  if (!rg) return true;
  if (!dateStr) return false;
  if (rg.from && dateStr < rg.from) return false;
  if (rg.to && dateStr > rg.to) return false;
  return true;
}

function filtered(){
  const out = [];
  for (const r of REGS){
    let ok = true;
    for (const [f, cfg] of Object.entries(FACETS)){
      const sel = state.sel[f];
      if (sel.size && !sel.has(r[cfg.key] || '（未標示）')) {ok = false; break;}
    }
    if (!ok) continue;
    if (state.requireMeeting && !r.meeting) continue;
    if (!inRange(r.uploaded, state.range.uploaded)) continue;
    if (!inRange(r.approved, state.range.approved)) continue;
    let as = null;
    if (state.asOf){
      as = resolveAsOf(r, state.asOf);
      if (as.notYet) continue;              // 該日尚未訂定
    }
    const m = matchQ(r, state.q);
    if (!m.ok) continue;
    out.push({r, hits:m.hits, as});
  }
  out.sort((a,b) => {
    if (state.sort === 'unit'){
      const d = (unitRank(a.r.unitLabel) - unitRank(b.r.unitLabel)) * state.dir;
      if (d) return d;
      return a.r.name.localeCompare(b.r.name,'zh-Hant');
    }
    if (state.sort === 'type'){
      const d = (typeRank(a.r.type) - typeRank(b.r.type)) * state.dir;
      if (d) return d;
      return a.r.name.localeCompare(b.r.name,'zh-Hant');
    }
    const x = val(a.r, state.sort), y = val(b.r, state.sort);
    if (x === y) return a.r.name.localeCompare(b.r.name,'zh-Hant');
    if (typeof x === 'number' && typeof y === 'number') return (x-y)*state.dir;
    return String(x).localeCompare(String(y),'zh-Hant') * state.dir;
  });
  return out;
}

function hl(text, q){
  const safe = esc(text);
  if (!q) return safe;
  const idx = safe.toLowerCase().indexOf(q.toLowerCase());
  if (idx < 0) return safe;
  return safe.slice(0,idx) + '<mark>' + safe.slice(idx, idx+q.length) + '</mark>' + safe.slice(idx+q.length);
}

const TB = '\u27e6TABLE\u27e7', TE = '\u27e6/TABLE\u27e7';

// 條文裡的表格（附件評分標準表、費用表等）還原成真正的 HTML 表格。
// 攤平成文字的話，「項目／說明／佐證單位」三欄會混成一團無法閱讀。
function renderBody(text, q){
  const parts = [];
  let rest = text;
  while (true){
    const i = rest.indexOf(TB);
    if (i < 0) { parts.push({t:'text', v:rest}); break; }
    if (i > 0) parts.push({t:'text', v:rest.slice(0, i)});
    const j = rest.indexOf(TE, i);
    const block = rest.slice(i + TB.length, j < 0 ? undefined : j);
    parts.push({t:'table', v:block});
    if (j < 0) break;
    rest = rest.slice(j + TE.length);
  }
  return parts.map(p => {
    if (p.t === 'text'){
      // 條文若剛好從表格中間切開，會殘留落單的結束標記，一併清掉
      const v = p.v.split(TB).join('').split(TE).join('').replace(/^\n+|\n+$/g,'');
      return v ? `<span class="txt">${hl(v, q)}</span>` : '';
    }
    const rows = p.v.split('\n').map(r => r.trim()).filter(Boolean).map(r => r.split('|'));
    if (!rows.length) return '';
    const width = Math.max(...rows.map(r => r.length));
    const cell = (c, tag) => `<${tag}>${hl((c||'').trim(), q)}</${tag}>`;
    // 只有在第一列每格都有值、且都短得像欄位名時才當表頭；
    // 跨頁續表的第一列是資料，誤判成表頭會讓整張表少一列又對不齊
    const r0 = rows[0];
    const looksHeader = r0.length === width && r0.every(c => (c||'').trim())
                        && Math.max(...r0.map(c => c.trim().length)) <= 12;
    const head = looksHeader ? rows.shift() : null;
    return `<div class="tbl-wrap"><table class="art-tbl">` +
      (head ? `<thead><tr>${head.map(c => cell(c,'th')).join('')}</tr></thead>` : '') +
      `<tbody>${rows.map(r =>
         `<tr>${Array.from({length:width}, (_,k) => cell(r[k],'td')).join('')}</tr>`).join('')}</tbody>` +
      `</table></div>`;
  }).join('');
}

function snippet(text, q){
  text = text.split(TB).join(' ').split(TE).join(' ');
  const i = text.toLowerCase().indexOf(q.toLowerCase());
  const s = Math.max(0, i-28);
  return (s>0?'…':'') + text.slice(s, i+q.length+70).replace(/\n/g,' ') + '…';
}

function render(){
  const rows = filtered();
  const pages = Math.max(1, Math.ceil(rows.length / state.per));
  if (state.page > pages) state.page = pages;
  const slice = rows.slice((state.page-1)*state.per, state.page*state.per);

  document.getElementById('count').textContent =
    `共 ${rows.length} 部` + (rows.length !== REGS.length ? `（全部 ${REGS.length} 部）` : '');

  const tb = document.getElementById('tbody');
  if (!rows.length){
    tb.innerHTML = `<tr><td colspan="8"><div class="empty"><strong>沒有符合的法規</strong>
      放寬條件或改用更短的關鍵字，例如以「休學」代替「學生申請休學程序」。</div></td></tr>`;
  } else {
    tb.innerHTML = slice.map((item, i) => {
      const r = item.r, n = (state.page-1)*state.per + i + 1;
      const open = state.open.has(r.id);
      const as = item.as;
      const shownDate = as ? (as.date || r.approved) : r.approved;
      const gap = as && !as.held && !as.unknown;
      const arts = (as && as.held) ? (as.held.cur ? r.arts : as.held.arts) : r.arts;
      const warn = r.layer !== 'native' ? `<div class="warn">⚠ ${esc(r.layer)}：文字擷取不完整，請核對原檔</div>` : '';
      const snip = item.hits.length
        ? `<div class="snippet">${item.hits.map(a =>
            `${a.l ? esc(a.l)+'　' : ''}${hl(snippet(a.t, state.q), state.q)}`).join('<br>')}</div>` : '';
      const main = `<tr class="row ${open?'open':''}" data-id="${r.id}" tabindex="0" role="button"
          aria-expanded="${open}" aria-label="展開 ${esc(r.name)}">
        <td class="seq">${n}</td>
        <td class="name">${r.kind==='SOP'?'<span class="kindtag">SOP</span>':''}${r.status!=='current'?`<span class="status-tag">${esc(r.statusLabel)}</span>`:''}${hl(r.name, state.q)}${r.code?`<span class="code">${esc(r.code)}</span>`:''}${warn}${snip}</td>
        <td class="hide-sm" data-l="會議">${esc(r.meeting || '—')}</td>
        <td data-l="單位">${esc(r.unitLabel)}</td>
        <td class="hide-sm" data-l="類別"><span class="badge-type">${esc(r.type || '其它')}</span></td>
        <td class="date" data-l="通過">${esc(shownDate || '—')}${gap?'<span class="gap-tag">未收錄該版</span>':''}</td>
        <td class="date hide-sm" data-l="上傳">${esc(r.uploaded || '—')}</td>
        <td class="num" data-l="條文">${gap ? '—' : arts.length}</td>
      </tr>`;
      if (!open) return main;
      const revs = r.revs.length
        ? `<div class="revs">${r.revs.map(x => `<div>${esc(x)}</div>`).join('')}</div>` : '';
      const asNote = !as ? '' : (
        gap
          ? `<div class="asof-warn"><strong>本庫未收錄 ${esc(state.asOf)} 當日適用的版本。</strong>
               依沿革，該日適用的是 <b>${esc(as.date)}</b> 修正版${as.line?`（${esc(as.line)}）`:''}，
               但版本庫目前只持有 ${esc(r.approved || '—')} 版。
               下方顯示的是<b>現行版本</b>，<u>不可直接作為 ${esc(state.asOf.slice(0,4))} 年度計畫的引用依據</u>，
               請向業管單位調閱該版原檔。</div>`
          : `<div class="asof-ok">顯示 <b>${esc(state.asOf)}</b> 當日適用之版本
               （${esc(as.date)} 修正，適用至 ${esc(as.held.to || '今')}）。</div>`);
      const arts_ = arts;
      const artsHtml = arts_.length
        ? `<div class="arts">${arts_.map(a =>
            `<div class="art"><div class="label">${a.l ? esc(a.l) : '—'}</div>
             <div class="body">${renderBody(a.t, state.q)}</div></div>`).join('')}</div>`
        : `<div class="empty">這份文件沒有切出條文，多半是表單或流程圖。請開原檔確認。</div>`;
      return main + `<tr class="detail"><td colspan="8"><div class="drawer">
          ${asNote}${revs}${artsHtml}
          ${(r.cites?.length || r.citedBy?.length) ? `<div class="links">
            ${r.cites?.length ? `<div class="lk"><span class="k">本法規引用</span>
              <ul>${r.cites.map(x => `<li>${esc(x.name)}${x.unit?`<span class="u">${esc(x.unit)}</span>`:''}${x.label?`<span class="u">見本法規 ${esc(x.label)}</span>`:''}</li>`).join('')}</ul></div>` : ''}
            ${r.citedBy?.length ? `<div class="lk"><span class="k">被以下法規引用</span>
              <ul>${r.citedBy.map(x => `<li>${esc(x.name)}${x.label?`<span class="u">${esc(x.label)}</span>`:''}${x.unit?`<span class="u">${esc(x.unit)}</span>`:''}</li>`).join('')}</ul></div>` : ''}
          </div>` : ''}
          <div class="foot">
            <span>來源：${esc(r.src || '—')}</span>
            ${r.moe ? `<span>教育部核備：${esc(r.moe)}</span>` : ''}
          </div></div></td></tr>`;
    }).join('');
  }

  // 分頁
  const pg = document.getElementById('pager');
  if (pages <= 1){ pg.innerHTML = ''; }
  else {
    const win = [];
    for (let p = Math.max(1, state.page-4); p <= Math.min(pages, state.page+4); p++) win.push(p);
    pg.innerHTML =
      `<button data-p="1" ${state.page===1?'disabled':''}>‹‹</button>` +
      `<button data-p="${state.page-1}" ${state.page===1?'disabled':''}>‹</button>` +
      win.map(p => `<button data-p="${p}" ${p===state.page?'aria-current="page"':''}>${p}</button>`).join('') +
      `<button data-p="${state.page+1}" ${state.page===pages?'disabled':''}>›</button>` +
      `<button data-p="${pages}" ${state.page===pages?'disabled':''}>››</button>`;
  }

  renderActive();
  for (const [f, cfg] of Object.entries(FACETS)){
    const btn = document.querySelector(`[data-facet="${f}"]`);
    // 整個資料集只有一種取值的分面不必存在（例如只匯入法規時的「法規／SOP」）
    btn.closest('li').hidden = values(cfg.key).length < 2;
    const b = btn.querySelector('.n');
    const n = state.sel[f].size;
    b.hidden = !n; b.textContent = n;
  }
  {
    const b = document.querySelector('[data-facet="asof"] .n');
    b.hidden = !state.asOf; b.textContent = '✓';
  }
  for (const f of Object.keys(DATE_FACETS)){
    const b = document.querySelector(`[data-facet="${f}"] .n`);
    b.hidden = !state.range[f]; b.textContent = '✓';
  }
  document.querySelectorAll('thead th.sortable').forEach(th => {
    th.setAttribute('aria-sort',
      th.dataset.sort === state.sort ? (state.dir === 1 ? 'ascending' : 'descending') : 'none');
    th.querySelector('.arrow').textContent =
      th.dataset.sort === state.sort ? (state.dir === 1 ? '▲' : '▼') : '▲';
  });
}

function renderActive(){
  const bar = document.getElementById('activeBar');
  const chips = [];
  for (const [f, cfg] of Object.entries(FACETS))
    for (const v of state.sel[f])
      chips.push(`<span class="chip"><span class="k">${cfg.label}</span>${esc(v)}
        <button data-rm="${f}" data-v="${esc(v)}" aria-label="移除">✕</button></span>`);
  for (const [f, label] of Object.entries(DATE_FACETS)){
    const rg = state.range[f];
    if (rg) chips.push(`<span class="chip"><span class="k">${label}</span>${esc(rg.from||'…')} ~ ${esc(rg.to||'…')}
      <button data-rmdate="${f}" aria-label="移除">✕</button></span>`);
  }
  if (state.asOf){
    chips.push(`<span class="chip asof"><span class="k">適用日期</span>${esc(state.asOf)} 當日有效條文
      <button data-rmasof="1" aria-label="回到現行">✕</button></span>`);
  }
  if (state.requireMeeting){
    const n = REGS.filter(r => !r.meeting).length;
    chips.push(`<span class="chip"><span class="k">已隱藏</span>查無通過會議 ${n} 部
      <button data-rmmeet="1" aria-label="取消隱藏">✕</button></span>`);
  }
  if (state.q) chips.push(`<span class="chip"><span class="k">關鍵字</span>${esc(state.q)}
    <button data-rmq="1" aria-label="移除">✕</button></span>`);
  bar.innerHTML = chips.length
    ? chips.join('') + `<button class="clear-all" id="clearAll">清除全部條件</button>` : '';
}

/* ── 對話框 ── */
const dlg = document.getElementById('dlg');
let dlgApply = null;

function openFacet(f){
  if (f === 'all'){
    for (const k of Object.keys(state.sel)) state.sel[k].clear();
    state.requireMeeting = false;
    state.range = {uploaded:null, approved:null}; state.q=''; document.getElementById('q').value='';
    state.page = 1; render(); return;
  }
  if (f === 'asof') return openAsOf();
  if (DATE_FACETS[f]) return openDate(f);

  const cfg = FACETS[f];
  document.getElementById('dlgTitle').textContent = `請選擇欲查詢法規之${cfg.label}`;
  const pending = new Set(state.sel[f]);
  const opt = ([v,c]) =>
    `<button type="button" data-v="${esc(v)}" aria-pressed="${pending.has(v)}">${esc(v)}<span class="c">${c}</span></button>`;

  let body;
  if (f === 'unit'){
    const order = ['行政單位','學術單位','校級中心','其他'];
    const buckets = new Map(order.map(t => [t, []]));
    for (const pair of values(cfg.key)) buckets.get(unitGroup(pair[0])).push(pair);
    for (const arr of buckets.values())
      arr.sort((a,b) => unitRank(a[0]) - unitRank(b[0]) || a[0].localeCompare(b[0],'zh-Hant'));
    body = order.filter(t => buckets.get(t).length).map(t =>
      `<div class="opt-group"><div class="opt-group-title">${t}</div>
       <div class="opts">${buckets.get(t).map(opt).join('')}</div></div>`).join('');
  } else {
    body = `<div class="opts">${values(cfg.key).map(opt).join('')}</div>`;
  }
  document.getElementById('dlgBody').innerHTML = body;
  document.getElementById('dlgBody').onclick = e => {
    const b = e.target.closest('button[data-v]'); if (!b) return;
    const v = b.dataset.v;
    if (pending.has(v)) pending.delete(v); else pending.add(v);
    b.setAttribute('aria-pressed', pending.has(v));
  };
  dlgApply = () => { state.sel[f] = pending; state.page = 1; };
  dlg.showModal();
}

function openAsOf(){
  document.getElementById('dlgTitle').textContent = '查詢某一日適用之條文';
  const roc = y => `${y + 1911}`;
  const yrs = [115, 114, 113, 112, 111];
  document.getElementById('dlgBody').innerHTML = `
    <p class="hint" style="margin:0 0 12px">
      政府補助計畫要引用「該年度適用」的條文。選一個日期，清單會改為顯示當日有效的版本；
      版本庫沒有那一版全文時會明白標示，不會拿現行版本充數。</p>
    <div class="date-grid">
      <label>適用日期<input type="date" id="aDate" value="${esc(state.asOf || '')}"></label>
    </div>
    <div class="quick">
      ${yrs.map(y => `<button type="button" data-y="${y}">${y} 年度（${roc(y)}）</button>`).join('')}
      <button type="button" data-y="0">回到現行</button>
    </div>`;
  document.getElementById('dlgBody').onclick = e => {
    const b = e.target.closest('button[data-y]'); if (!b) return;
    const y = +b.dataset.y;
    // 年度以 12/31 為代表日：全年適用的版本即為年底當日有效者
    document.getElementById('aDate').value = y ? `${y + 1911}-12-31` : '';
  };
  dlgApply = () => { state.asOf = document.getElementById('aDate').value; state.page = 1; };
  dlg.showModal();
}

function openDate(f){
  document.getElementById('dlgTitle').textContent = `請選擇欲查詢法規之${DATE_FACETS[f]}`;
  const rg = state.range[f] || {from:'', to:''};
  document.getElementById('dlgBody').innerHTML = `
    <div class="date-grid">
      <label>開始日期<input type="date" id="dFrom" value="${esc(rg.from||'')}"></label>
      <label>結束日期<input type="date" id="dTo" value="${esc(rg.to||'')}"></label>
    </div>
    <div class="quick">
      <button type="button" data-q="term">本學期</button>
      <button type="button" data-q="ay">本學年</button>
      <button type="button" data-q="m1">最近一個月</button>
      <button type="button" data-q="m3">最近三個月</button>
      <button type="button" data-q="y1">最近一年</button>
    </div>`;
  const iso = d => d.toISOString().slice(0,10);
  document.getElementById('dlgBody').onclick = e => {
    const b = e.target.closest('button[data-q]'); if (!b) return;
    const now = new Date(); let from = new Date(now);
    if (b.dataset.q === 'm1') from.setMonth(now.getMonth()-1);
    else if (b.dataset.q === 'm3') from.setMonth(now.getMonth()-3);
    else if (b.dataset.q === 'y1') from.setFullYear(now.getFullYear()-1);
    else if (b.dataset.q === 'term'){
      // 上學期 8/1 起，下學期 2/1 起
      from = now.getMonth()+1 >= 8 ? new Date(now.getFullYear(),7,1)
           : now.getMonth()+1 >= 2 ? new Date(now.getFullYear(),1,1)
           : new Date(now.getFullYear()-1,7,1);
    } else if (b.dataset.q === 'ay'){
      from = now.getMonth()+1 >= 8 ? new Date(now.getFullYear(),7,1) : new Date(now.getFullYear()-1,7,1);
    }
    document.getElementById('dFrom').value = iso(from);
    document.getElementById('dTo').value = iso(now);
  };
  dlgApply = () => {
    const from = document.getElementById('dFrom').value;
    const to = document.getElementById('dTo').value;
    state.range[f] = (from || to) ? {from, to} : null;
    state.page = 1;
  };
  dlg.showModal();
}

document.getElementById('dlgOk').onclick = () => { if (dlgApply) dlgApply(); dlg.close(); render(); };
document.getElementById('dlgCancel').onclick = () => dlg.close();
document.getElementById('dlgX').onclick = () => dlg.close();

/* ── 事件 ── */
document.querySelector('.facets').addEventListener('click', e => {
  const b = e.target.closest('button[data-facet]'); if (b) openFacet(b.dataset.facet);
});
document.getElementById('activeBar').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'clearAll') return openFacet('all');
  if (t.dataset.rm) state.sel[t.dataset.rm].delete(t.dataset.v);
  if (t.dataset.rmdate) state.range[t.dataset.rmdate] = null;
  if (t.dataset.rmasof) state.asOf = '';
  if (t.dataset.rmmeet) state.requireMeeting = false;
  if (t.dataset.rmq){ state.q=''; document.getElementById('q').value=''; }
  state.page = 1; render();
});
const doSearch = () => { state.q = document.getElementById('q').value.trim(); state.page = 1; render(); };
document.getElementById('qbtn').onclick = doSearch;
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.getElementById('q').addEventListener('input', e => { if (!e.target.value) doSearch(); });

document.getElementById('tbody').addEventListener('click', e => {
  const tr = e.target.closest('tr.row'); if (!tr) return;
  const id = tr.dataset.id;
  state.open.has(id) ? state.open.delete(id) : state.open.add(id);
  render();
});
document.getElementById('tbody').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const tr = e.target.closest('tr.row'); if (!tr) return;
  e.preventDefault(); tr.click();
});
document.querySelector('thead').addEventListener('click', e => {
  const th = e.target.closest('th.sortable'); if (!th) return;
  const k = th.dataset.sort;
  if (state.sort === k) state.dir = -state.dir; else { state.sort = k; state.dir = 1; }
  render();
});
document.getElementById('pager').addEventListener('click', e => {
  const b = e.target.closest('button[data-p]'); if (!b) return;
  state.page = +b.dataset.p; render();
  document.querySelector('main').scrollIntoView({block:'start'});
});
document.getElementById('expandAll').onclick = e => {
  const rows = filtered().slice((state.page-1)*state.per, state.page*state.per);
  const allOpen = rows.every(x => state.open.has(x.r.id));
  rows.forEach(x => allOpen ? state.open.delete(x.r.id) : state.open.add(x.r.id));
  e.target.textContent = allOpen ? '全部展開' : '全部收合';
  render();
};
document.getElementById('exportCsv').onclick = () => {
  const items = filtered();
  const head = state.asOf
    ? ['編號','法規名稱','業管單位','狀態','法規類別','通過會議',`${state.asOf} 當日適用版本`,'本庫是否持有該版','條文數','來源檔']
    : ['編號','法規名稱','業管單位','狀態','法規類別','通過會議','通過日期','條文數','來源檔'];
  const body = items.map(({r, as}) => state.asOf
    ? [r.code, r.name, r.unitLabel, r.statusLabel, r.type, r.meeting,
       (as && as.date) || r.approved, (as && as.held) ? '是' : '否',
       (as && as.held) ? as.held.arts.length : '', r.src]
    : [r.code, r.name, r.unitLabel, r.statusLabel, r.type, r.meeting, r.approved, r.arts.length, r.src]);
  const clean = v => String(v ?? '').split(TB).join('【表】').split(TE).join('');
  const csv = '\ufeff' + [head, ...body]
    .map(row => row.map(c => `"${clean(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = '法規查詢結果.csv'; a.click(); URL.revokeObjectURL(a.href);
};

// 安裝成 App 後可離線查閱；GitHub Pages 是 HTTPS，符合註冊條件
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

try {
  render();
} catch (err) {
  document.getElementById('tbody').innerHTML =
    `<tr><td colspan="8"><div class="empty"><strong>頁面載入失敗</strong>
     資料沒有問題，是頁面程式出錯了。請把下面這行回報給校務發展組：<br>
     <code style="font-family:var(--mono);font-size:12px">${String(err)}</code></div></td></tr>`;
  console.error(err);
}
</script>
</body>
